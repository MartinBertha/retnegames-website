<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11110f">
  <title>retne hub</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script src="/hub/theme.js"></script>
  <link rel="stylesheet" href="/hub/hub.css">
  <script type="module" src="/hub/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">retne hub</span>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol id="breadcrumb"></ol>
    </nav>
    <p id="save-status" class="save-status" role="status" aria-live="off"></p>
    <div class="topbar-actions">
      <button type="button" id="theme-toggle" class="icon-button theme-toggle" aria-label="Theme">
        <svg data-icon="system" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="icon-fill"/></svg>
        <svg data-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
        <svg data-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button type="button" id="more-button" class="icon-button" aria-label="More" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3" class="icon-fill"/><circle cx="12" cy="12" r="1.3" class="icon-fill"/><circle cx="19" cy="12" r="1.3" class="icon-fill"/></svg>
      </button>
      <div id="more-menu" class="app-menu" role="menu" aria-label="More" hidden>
        <button type="button" id="export-button" class="menu-item" role="menuitem">Export everything</button>
        <button type="button" id="import-button" class="menu-item" role="menuitem">Import an export…</button>
      </div>
      <input type="file" id="import-input" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="workspace">
    <nav class="toolbar" aria-label="Toolbar">
      <button type="button" id="add-note" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span class="tool-label">Note</span>
      </button>
      <button type="button" id="add-checklist" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="5" height="5" rx="1"/><path d="M4.8 16.8l1.4 1.4 2.6-2.8M12 7h8.5M12 17h8.5"/></svg>
        <span class="tool-label">Checklist</span>
      </button>
      <button type="button" id="add-image" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-10 9"/></svg>
        <span class="tool-label">Image</span>
      </button>
      <button type="button" id="add-link" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span class="tool-label">Link</span>
      </button>
      <button type="button" id="add-section" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" stroke-dasharray="3 2.5"/><path d="M3 8.5h18"/></svg>
        <span class="tool-label">Section</span>
      </button>
      <button type="button" id="add-folder" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="tool-label">Folder</span>
      </button>
      <span class="toolbar-gap" aria-hidden="true"></span>
      <button type="button" id="undo" class="tool" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        <span class="tool-label">Undo</span>
      </button>
      <button type="button" id="redo" class="tool" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        <span class="tool-label">Redo</span>
      </button>
      <input type="file" id="image-input" multiple hidden>
    </nav>

    <main id="canvas" class="canvas" aria-label="Board canvas">
      <div id="world" class="world"></div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <div class="zoom-controls canvas-overlay" role="group" aria-label="Zoom">
        <button type="button" id="zoom-out" class="icon-button" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        </button>
        <button type="button" id="zoom-reset" class="zoom-level" aria-label="Zoom 100%, reset to 100%">100%</button>
        <button type="button" id="zoom-in" class="icon-button" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg>
        </button>
        <button type="button" id="fit-all" class="icon-button" aria-label="Fit all cards" title="Fit all (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
        </button>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">retne hub needs JavaScript.</p></noscript>
</body>
</html>
