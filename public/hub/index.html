<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0a">
  <title>retne hub</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/hub/hub.css">
  <script type="module" src="/hub/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">retne hub</span>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol id="breadcrumb"></ol>
    </nav>
    <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
  </header>

  <div class="workspace">
    <nav class="toolbar" aria-label="Toolbar">
      <button type="button" id="add-note" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span class="tool-label">Note</span>
      </button>
      <button type="button" id="add-checklist" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="5" height="5" rx="1"/><path d="M4.8 16.8l1.4 1.4 2.6-2.8M12 7h8.5M12 17h8.5"/></svg>
        <span class="tool-label">Checklist</span>
      </button>
      <button type="button" id="add-image" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-10 9"/></svg>
        <span class="tool-label">Image</span>
      </button>
      <button type="button" id="add-link" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span class="tool-label">Link</span>
      </button>
      <button type="button" id="add-section" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" stroke-dasharray="3 2.5"/><path d="M3 8.5h18"/></svg>
        <span class="tool-label">Section</span>
      </button>
      <button type="button" id="add-folder" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="tool-label">Folder</span>
      </button>
      <span class="toolbar-gap" aria-hidden="true"></span>
      <button type="button" id="undo" class="tool" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        <span class="tool-label">Undo</span>
      </button>
      <button type="button" id="redo" class="tool" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        <span class="tool-label">Redo</span>
      </button>
      <input type="file" id="image-input" multiple hidden>
    </nav>

    <main id="canvas" class="canvas" aria-label="Board canvas">
      <div id="world" class="world"></div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
